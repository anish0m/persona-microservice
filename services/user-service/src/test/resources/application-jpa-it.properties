# ---------------------------------------------------------------------------
# Profile: jpa-it. Used only by JpaUserRepositoryIT.  Day-04.
#
# The sibling of application-jdbc-it.properties, pointing at the same database
# and the same Flyway migrations. Two integration suites, two implementations,
# ONE schema — which is the point. If V1 were wrong, both would fail.
#
#     docker compose up -d persona-user-db
#     mvn test -Dit=true
#
# Port 5435 and database persona_user — this service's OWN database, not the
# monolith's on 5434. Same code, different data, which is the architecture.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/persona_user
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

# VALIDATE, exactly as in production. Using `create-drop` here — which is what
# most tutorials do for tests — would be actively harmful: the suite would build
# its own schema from the entities and pass, while proving NOTHING about whether
# the entities match the migrations that ship. The mismatch would surface in
# production instead, which is the failure this profile exists to prevent.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Day-07. Added when WalletClient became a bean in this service — which
# widened what @SpringBootTest has to instantiate and broke every IT with:
#
#     Could not resolve placeholder 'persona.wallet-service.url'
#
# The value IS in src/main/resources/application.properties. It does not
# arrive, because src/test/resources/application.properties SHADOWS the main
# file rather than merging with it. Same trap the monolith hit today with the
# JWT secret, same afternoon, different property.
#
# Duplicated into both *-it files on purpose. Clever single definitions in the
# shadowing file were tried in the monolith and failed in three different ways
# before this arrangement worked. A missing property fails loudly at context
# startup; a clever one fails silently.
#
# A PORT NOTHING IS LISTENING ON, deliberately. These are repository tests —
# they must not depend on wallet-service being up, and the only code path that
# would dial this URL is login, which they do not exercise. If a test ever
# does reach it, the connection is refused immediately rather than hanging,
# and WalletClient's retry-then-log-and-continue behaviour is what gets
# exercised. That is the correct outcome to observe in a test that was not
# trying to make a network call.
# ---------------------------------------------------------------------------
persona.wallet-service.url=http://localhost:1

# JWT signing, same story as the URL above: present in the main properties
# file, shadowed away by src/test/resources/application.properties, needed
# here because Day-07 widened the context these tests build.
#
# A DIFFERENT SECRET FROM PRODUCTION, deliberately — a test passing with the
# real signing key would keep passing after that key is rotated, and is one
# more place the real key is written down.
persona.jwt.secret=1111111111111111111111111111111111111111111111111111111111111111
persona.jwt.expiration-ms=900000
