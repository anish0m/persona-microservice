# ---------------------------------------------------------------------------
# Profile: cache-it. Used only by UserCacheIT.  Day-12.
#
# A third *-it profile rather than reusing jpa-it, for one reason that is not
# tidiness: this suite needs Hibernate's statistics switched on so it can
# COUNT queries, and that is a measurement tool with a runtime cost. Leaving
# it on in jpa-it would make an unrelated suite pay for it; leaving it on in
# production would be worse.
#
#     docker compose up -d persona-user-db
#     redis-cli ping                       # must answer PONG
#     mvn test -Dit=true -Dtest=UserCacheIT
#
# Port 5435 — the HOST-side mapping from docker-compose.yml, and a different
# database from the monolith's 5434. The two architectures never share state.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/persona_user
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# THE INSTRUMENT THIS SUITE IS BUILT AROUND.
#
# Both properties are required and they are not the same switch: the Spring
# Boot property exposes the Statistics bean, the Hibernate property makes it
# actually collect. With only the first, every count reads zero — which looks
# exactly like a perfectly working cache. A measurement that fails by
# reporting success is the most dangerous kind, and it is why
# theQueryCounterActuallyCounts() asserts a count GOES UP before any other
# test trusts a count that stays flat.
spring.jpa.properties.hibernate.generate_statistics=true

# Statement logging off, deliberately. This suite counts statements rather
# than reading them, and 200 formatted SQL blocks in the output would bury the
# one assertion failure that matters.
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Redis — DATABASE 3.
#
# Four numbered databases are now in use on this one instance, and the
# bookkeeping is deliberate:
#
#     0   monolith, running application
#     1   monolith, UserCacheIT
#     2   user-service, running application
#     3   user-service, UserCacheIT      <-- this file
#
# A test suite that flushed a database shared with a running application would
# clear that application's cache from under it — harmless by the rule Day-12
# opened with (slow, never wrong) and still a surprise nobody asked for. It
# runs the other way too: a stray key left by a dev application under a key
# this suite expects to be absent makes a test fail for a reason that is not
# in this repository.
#
# Redis databases are a numbered namespace on ONE instance, not separate
# servers — so this isolates keys, NOT CPU. The single thread is shared by all
# four. Fine here; worth knowing before using db numbers to isolate a load
# test from anything.
# ---------------------------------------------------------------------------
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=3
spring.cache.type=redis

# A SHORT TTL, so the expiry test does not take ten minutes.
#
# 3 seconds is long enough that no assertion in this file races it by accident
# and short enough to wait for once. The production value is 10m in
# application.properties; this override is why that number is a property
# rather than a constant in code.
spring.cache.redis.time-to-live=3s
spring.cache.redis.key-prefix=user-service-test:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=true

# Same reasoning as the other two *-it profiles: @SpringBootTest builds the
# whole context, JwtService is in it, and it cannot be built without a key.
# A different secret from production, deliberately.
persona.jwt.secret=1111111111111111111111111111111111111111111111111111111111111111
persona.jwt.expiration-ms=900000
