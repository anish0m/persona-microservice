# ---------------------------------------------------------------------------
# Test configuration. Spring Boot prefers this file over the main one when
# running tests, so nothing here affects the running application.
#
# WHY THE TEST PROFILE EXISTS
#
# Day-03 introduced two implementations of UserRepository, selected by profile:
#
#     @Profile("test")   InMemoryUserRepository
#     @Profile("!test")  JdbcUserRepository
#
# Without this line, the test suite would pick the JDBC one and every test
# would need a running PostgreSQL. That is a real trade and worth naming:
#
#   in-memory     fast, no setup, and tests NOTHING about the SQL
#   real database slow, needs a container, and tests what actually ships
#
# The honest answer is BOTH, at different levels. The controller and service
# tests do not care where data lives, so they use the fast fake. The
# repository's SQL genuinely cannot be tested without a database, and
# JdbcUserRepositoryIT does that against a real Postgres.
#
# The failure to avoid is a suite that is entirely fakes: it goes green while
# the SQL has a typo in a column name, because nothing ever executed it.
# ---------------------------------------------------------------------------
spring.profiles.active=test

# No DataSource is needed under the test profile, and asking Spring Boot to
# auto-configure one would make every test depend on a database being
# reachable. Excluding them here is what keeps the fast tests honest about
# being fast tests.
# NOTE the profile-specific form: these exclusions apply ONLY when the "test"
# profile is active. Spring MERGES property lists across profiles rather than
# replacing them, so putting them in the unqualified file and then writing an
# empty value in application-jdbc-it.properties does NOT switch them back on —
# a mistake worth recording, because the symptom was a silent one: Flyway never
# ran, no log line said so, and the failure surfaced as
# 'relation "users" does not exist'.
#
# The --- below starts a second DOCUMENT in this file. Everything after it is
# conditional on the profile named in spring.config.activate.on-profile.
#---
spring.config.activate.on-profile=test
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
