# ---------------------------------------------------------------------------
# Profile: jdbc-it. Used only by JdbcUserRepositoryIT.
#
# The base test properties switch the DataSource OFF so the fast tests need no
# database. This profile switches it back ON and points at the compose
# container, because this is the one test class whose entire purpose is to
# execute real SQL.
#
#     docker compose up -d persona-monolith-db
#     mvn test -Dit=true
#
# Port 5434 — the HOST-side mapping from docker-compose.yml. Inside the compose
# network the app uses persona-monolith-db:5432 instead; here the test runs on
# the host, so it goes through the published port.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/persona_user
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true



# JWT signing, same story as the URL above: present in the main properties
# file, shadowed away by src/test/resources/application.properties, needed
# here because Day-07 widened the context these tests build.
#
# A DIFFERENT SECRET FROM PRODUCTION, deliberately — a test passing with the
# real signing key would keep passing after that key is rotated, and is one
# more place the real key is written down.
persona.jwt.secret=1111111111111111111111111111111111111111111111111111111111111111
persona.jwt.expiration-ms=900000
