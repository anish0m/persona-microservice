# ---------------------------------------------------------------------------
# user-service configuration
# ---------------------------------------------------------------------------

spring.application.name=user-service

# 8081, NOT 8080. Every service needs a distinct port, because they all run at
# the same time on the same machine during development. The monolith keeps 8080.
# Port map as services are added:
#   8080  persona-monolith  (the other project)
#   8081  user-service
#   8082  (next service)
#   8000  api-gateway       (Day-17)
server.port=8081

# ---------------------------------------------------------------------------
# Day-04 adds a datasource here - and it will point at a database that ONLY
# user-service may connect to (database-per-service).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Day-03 — PostgreSQL. ITS OWN DATABASE, on its own server.
#
# persona_user, not persona. This service owns its data absolutely: no other
# service connects here, and the monolith's database is a different container
# entirely. That separation is the whole architectural claim of microservices,
# and it is the reason a wallet-service will NOT be able to write
# REFERENCES users(id) — a foreign key is enforced by ONE database process.
#
# Overridden inside Docker by SPRING_DATASOURCE_* (host persona-user-db:5432).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/persona_user
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Day-04 — which UserRepository implementation is live.
#
#     test   InMemoryUserRepository   a HashMap, no database          (slice 4)
#     jdbc   JdbcUserRepository       hand-written SQL, JdbcClient    (Day-03)
#     jpa    JpaUserRepository        Hibernate via Spring Data       (Day-04)
#
# Exactly one may be active. Two matching profiles is
# NoUniqueBeanDefinitionException at startup; none is
# NoSuchBeanDefinitionException. Both fail loudly at boot, which is the point.
#
# Switch without editing this file:  --spring.profiles.active=jdbc
# ---------------------------------------------------------------------------
spring.profiles.active=jpa

# ---------------------------------------------------------------------------
# VALIDATE. Never `update`, and this is the most important line in the file.
#
#   validate  check every @Entity claim against the real schema, refuse to
#             start if any is wrong. Changes nothing.
#   update    silently ALTER TABLE until Hibernate is right.
#   create    drop and recreate on every start. Data loss as a default.
#
# FLYWAY OWNS THE SCHEMA — Day-03's decision, and this line is what keeps it
# true. With `update`, Hibernate would quietly alter tables until V1 no longer
# described the real database and a teammate cloning the repo would get a
# different schema, with nothing saying so. Exactly the Day-03 failure mode:
# present but not participating, surfacing one layer away.
#
# It matters MORE here than in the monolith. Each service owns its own database,
# so a drifting schema drifts in one service only — and the mismatch shows up as
# a failed inter-service call, three network hops from the cause.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# The only way to see an N+1 problem: count the statements, do not reason about
# them. Invisible in the Java, obvious in the log.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-Session-In-View OFF. Boot defaults it ON, which holds a database
# connection for the whole request and lets N+1 queries happen during JSON
# serialization where no code shows them. Off, a lazy association touched
# outside the transaction throws LazyInitializationException — the correct loud
# signal that it should have been fetched inside, or mapped to a DTO first.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Day-06, piece 1 — JWT signing.
#
# Same mechanics as the monolith (HMAC-SHA256, 256-bit key, hex-encoded) — see
# that file for the reasoning on key length and the dated-debt note about this
# living in git instead of an environment variable.
#
# MICROSERVICE-SPECIFIC CONCERN, not yet resolved: this secret is currently
# only used by user-service, which both issues and validates its own tokens.
# The moment a SECOND service needs to verify a token user-service issued —
# wallet-service checking who is calling it, say — that service needs this
# same secret, which means it stops being "user-service's config" and becomes
# shared infrastructure (a secrets manager, or a shared config server). Not
# solved here on purpose: the problem should be felt when it is real, on the
# day a second service actually needs it, rather than guessed at now.
# ---------------------------------------------------------------------------
persona.jwt.secret=087387cb03fa11b5356dd91e62d5a26ac13ee193b1a469661b91c7d250dfe9f9

persona.jwt.expiration-ms=900000

# ---------------------------------------------------------------------------
# Day-07 — where wallet-service lives.
#
# A URL in a config file is the crudest possible form of service discovery,
# and naming that is the point: in the monolith, finding WalletService was
# Spring injecting a bean, and it could not be wrong. Here it is a string that
# can point at nothing, at the wrong environment, or at a service that moved.
#
# This is also why Day-17 brings an API gateway and, in a larger system, a
# service registry. Hardcoding hostnames stops scaling the moment there is
# more than one instance of wallet-service — which is the very thing the split
# was supposed to make possible.
#
# localhost:8082 for running the services directly. docker-compose overrides
# it with the container name, because inside the network the host is the
# service name, not localhost.
# ---------------------------------------------------------------------------
persona.wallet-service.url=http://localhost:8082
