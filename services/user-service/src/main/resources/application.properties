# ---------------------------------------------------------------------------
# user-service configuration
# ---------------------------------------------------------------------------

spring.application.name=user-service

# 8081, NOT 8080. Every service needs a distinct port, because they all run at
# the same time on the same machine during development. The monolith keeps 8080.
# Port map as services are added:
#   8080  persona-monolith  (the other project)
#   8081  user-service
#   8082  (next service)
#   8000  api-gateway       (Day-17)
server.port=8081

# ---------------------------------------------------------------------------
# Day-04 adds a datasource here - and it will point at a database that ONLY
# user-service may connect to (database-per-service).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Day-03 — PostgreSQL. ITS OWN DATABASE, on its own server.
#
# persona_user, not persona. This service owns its data absolutely: no other
# service connects here, and the monolith's database is a different container
# entirely. That separation is the whole architectural claim of microservices,
# and it is the reason a second service will NOT be able to write
# REFERENCES users(id) — a foreign key is enforced by ONE database process.
#
# Overridden inside Docker by SPRING_DATASOURCE_* (host persona-user-db:5432).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/persona_user
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Day-04 — which UserRepository implementation is live.
#
#     test   InMemoryUserRepository   a HashMap, no database          (slice 4)
#     jdbc   JdbcUserRepository       hand-written SQL, JdbcClient    (Day-03)
#     jpa    JpaUserRepository        Hibernate via Spring Data       (Day-04)
#
# Exactly one may be active. Two matching profiles is
# NoUniqueBeanDefinitionException at startup; none is
# NoSuchBeanDefinitionException. Both fail loudly at boot, which is the point.
#
# Switch without editing this file:  --spring.profiles.active=jdbc
# ---------------------------------------------------------------------------
spring.profiles.active=jpa

# ---------------------------------------------------------------------------
# VALIDATE. Never `update`, and this is the most important line in the file.
#
#   validate  check every @Entity claim against the real schema, refuse to
#             start if any is wrong. Changes nothing.
#   update    silently ALTER TABLE until Hibernate is right.
#   create    drop and recreate on every start. Data loss as a default.
#
# FLYWAY OWNS THE SCHEMA — Day-03's decision, and this line is what keeps it
# true. With `update`, Hibernate would quietly alter tables until V1 no longer
# described the real database and a teammate cloning the repo would get a
# different schema, with nothing saying so. Exactly the Day-03 failure mode:
# present but not participating, surfacing one layer away.
#
# It matters MORE here than in the monolith. Each service owns its own database,
# so a drifting schema drifts in one service only — and the mismatch shows up as
# a failed inter-service call, three network hops from the cause.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# The only way to see an N+1 problem: count the statements, do not reason about
# them. Invisible in the Java, obvious in the log.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-Session-In-View OFF. Boot defaults it ON, which holds a database
# connection for the whole request and lets N+1 queries happen during JSON
# serialization where no code shows them. Off, a lazy association touched
# outside the transaction throws LazyInitializationException — the correct loud
# signal that it should have been fetched inside, or mapped to a DTO first.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Day-06, piece 1 — JWT signing.
#
# Same mechanics as the monolith (HMAC-SHA256, 256-bit key, hex-encoded) — see
# that file for the reasoning on key length and the dated-debt note about this
# living in git instead of an environment variable.
#
# MICROSERVICE-SPECIFIC CONCERN, not yet resolved: this secret is currently
# only used by user-service, which both issues and validates its own tokens.
# The moment a SECOND service needs to verify a token user-service issued —
# checking who is calling it, say — that service needs this
# same secret, which means it stops being "user-service's config" and becomes
# shared infrastructure (a secrets manager, or a shared config server). Not
# solved here on purpose: the problem should be felt when it is real, on the
# day a second service actually needs it, rather than guessed at now.
# ---------------------------------------------------------------------------
persona.jwt.secret=087387cb03fa11b5356dd91e62d5a26ac13ee193b1a469661b91c7d250dfe9f9

persona.jwt.expiration-ms=900000

# ---------------------------------------------------------------------------
# Day-12 — Redis, as a cache and nothing else.
#
# THE RULE THAT GOVERNS EVERY LINE BELOW: deleting this entire Redis instance
# must make user-service slow, never wrong. Every value cached here has its
# authoritative copy in PostgreSQL. The moment that stops being true, Redis
# has silently become a database — one with no durability guarantee, no
# transactions and no backup — and nothing in the code would say so.
#
# No password: the same dated debt as the datasource password and the JWT
# secret above, and it belongs to the same unresolved microservice concern.
# An unauthenticated Redis bound to a public interface is a way to lose a
# machine, not merely to leak data; it is acceptable here only because this
# one listens on 127.0.0.1.
# ---------------------------------------------------------------------------
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# DATABASE 2, where the monolith uses 0.
#
# Both architectures are developed on this machine against ONE Redis, and a
# flat key space shared by two applications is how a debugging session ends up
# reading the other one's data. This is a development convenience and NOT the
# production answer: numbered databases are a namespace on a single instance,
# so they isolate keys while sharing the one CPU — and that single thread is
# the thing Redis makes you budget. In production each service gets its own
# instance, which is also what makes the key prefix below the real defence.
spring.data.redis.database=2

# Fail fast rather than hang. The default is infinite, which turns "Redis is
# down" into "every request that touches a cache blocks forever" — a cache
# outage escalated into a total outage, which is the opposite of what a cache
# is for. In this architecture that matters more than in the monolith: a
# request blocked here holds a thread in user-service, and an upstream caller
# waiting on it holds one of its own, so one slow dependency propagates
# backwards through every service in the chain. See CacheConfig's error
# handler for the other half of the argument.
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=1000ms

# The cache type, stated rather than inferred. Boot would pick redis anyway
# because the starter is on the classpath; writing it down means a missing
# dependency is a startup failure instead of a silent downgrade to an
# in-process map that behaves correctly on one replica and wrongly on two.
spring.cache.type=redis

# TTL IS NOT A CORRECTNESS MECHANISM. Eviction on write is (see UserService).
# This is the backstop for the eviction that never happened — a missed evict,
# a crash between the commit and the delete, a race. Ten minutes is the answer
# to "how long may a stale profile be visible in the worst case", and the
# honest reading of this number is: that long.
spring.cache.redis.time-to-live=10m

# THE KEY PREFIX NAMES THE SERVICE, not the application.
#
# `user-service:users::ada@example.com`. Redis has one flat key space per
# database — no tables, no schemas — so key naming is the only schema there
# is, and in a system of services the first thing a key must answer is WHO
# OWNS THIS VALUE. A bare `users::ada@example.com` is a key any service could
# plausibly have written, which is the ambiguity that makes a shared cache
# unsafe to clean up. The prefix also gives a group to invalidate.
spring.cache.redis.key-prefix=user-service:
spring.cache.redis.use-key-prefix=true

# Cache nulls, deliberately. A request for an email that does not exist
# otherwise misses every time and reaches PostgreSQL every time — the cache
# offers no protection against a flood of lookups for ids that were never
# real. Spring stores a distinguishable NullValue sentinel, which is the part
# worth noticing: an empty string would be indistinguishable from a missing
# key on a plain GET, so code checking "did I get something back" would treat
# a successfully cached absence as a miss and query anyway — removing the
# benefit while appearing to work.
spring.cache.redis.cache-null-values=true
