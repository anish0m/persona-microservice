# ---------------------------------------------------------------------------
# wallet-service configuration. Day-07.
#
# Compare this file with services/user-service/src/main/resources/
# application.properties. They are nearly identical — same JPA settings, same
# Flyway settings, same ddl-auto. That sameness is worth noticing: a
# microservice is not a different kind of program, it is the same Spring Boot
# application with a narrower responsibility.
#
# THE TWO LINES THAT DIFFER ARE THE ARCHITECTURE:
#   server.port          a separate process
#   spring.datasource.*  a separate database
#
# Everything else about "being a microservice" follows from those two.
# ---------------------------------------------------------------------------

spring.application.name=wallet-service

# 8080 monolith · 8081 user-service · 8082 here.
# Three ports because three processes. In production these would each be a
# container with its own scaling policy — which is the thing the split buys.
server.port=8082

# ---------------------------------------------------------------------------
# ITS OWN DATABASE — the decision that makes this a microservice rather than
# a distributed monolith.
#
# persona_wallet on 5436. user-service uses persona_user on 5435. Two
# PostgreSQL CONTAINERS, not two schemas in one.
#
# The cheaper option — one Postgres, two schemas — would keep foreign keys
# working and would make the whole exercise a lie: the services would still be
# joined at the database, which is the one coupling that makes independent
# deployment impossible. You cannot restore a backup, migrate, or fail over
# one service without touching the other.
#
# So wallets.user_id has NO foreign key, there is no join to users, and no
# transaction can span signup. See V1's comment for the full accounting.
#
# Password in the file, in git: the same dated debt as every other service
# here, and the same plan — an environment variable, one new concept at a time.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5436/persona_wallet
spring.datasource.username=persona
spring.datasource.password=persona

spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# VALIDATE. Never `update`, and the reasoning is unchanged from the monolith:
# Flyway owns the schema, and this line is what keeps that true. With `update`,
# Hibernate would quietly ALTER TABLE until V1 no longer described the real
# database and a teammate cloning the repo would get something different.
#
# It also does real work on Day-07 specifically. Wallet declares
# precision = 19, scale = 4 on the balance; if that disagreed with
# NUMERIC(19,4), this setting fails the boot naming the column. A silent
# mismatch there is money being rounded differently than the schema promises.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-Session-In-View OFF. Boot's default is ON, which holds a database
# connection for the whole request and lets lazy loading happen inside the
# JSON serializer, where no code shows it.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Day-07 — money on the wire.
#
# The backstop, not the mechanism. The mechanism is WalletResponse, which
# converts the balance with toPlainString() so money leaves as the string
# "1.1000" rather than the JSON number 1.1. This property catches any
# BigDecimal that reaches Jackson by another route.
#
# Both matter because JSON numbers are parsed into IEEE-754 doubles by every
# JavaScript client in existence — handing the value to the exact type the
# whole day was spent avoiding, at the final step.
# ---------------------------------------------------------------------------
spring.jackson.generator.write-bigdecimal-as-plain=true

# ---------------------------------------------------------------------------
# JWT — THE SAME SECRET AS user-service, and note what is NOT here.
#
# There is no persona.jwt.expiration-ms. This service never issues a token; it
# only verifies ones user-service minted, reading the lifetime from each
# token's own `exp` claim. A property that would never be read is a property
# that goes stale without anyone noticing.
#
# THE SHARED SECRET IS A REAL COUPLING, named so it is not mistaken for free.
# Rotating it means rotating BOTH deployments together — miss one and every
# token minted by the other is rejected. An asymmetric key pair (RS256:
# user-service signs with a private key, every other service verifies with the
# public one) removes this, and is the usual production answer.
#
# What the shared secret buys is the thing worth having: wallet-service
# authenticates a request with zero network calls. Authentication scales to N
# services without N round trips back to the issuer.
# ---------------------------------------------------------------------------
persona.jwt.secret=087387cb03fa11b5356dd91e62d5a26ac13ee193b1a469661b91c7d250dfe9f9
