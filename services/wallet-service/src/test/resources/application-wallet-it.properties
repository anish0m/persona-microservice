# ---------------------------------------------------------------------------
# Profile: wallet-it. Used only by WalletIT. Day-07.
#
# Points at persona-wallet-db — wallet-service's OWN database, on host port
# 5436. user-service's integration tests point at 5435.
#
# THAT IS THE ARCHITECTURE SHOWING UP IN A TEST CONFIG FILE. In the monolith
# there is one test database because there is one database. Here there are
# two, and an integration test for wallet-service cannot see a users table at
# all — not because it is configured not to, but because no such table exists
# in the database it connects to. A test that tried to join users would fail
# with `relation "users" does not exist`, which is the correct and useful
# failure.
#
#     docker compose up -d persona-wallet-db
#     mvn test -Dit=true -pl services/wallet-service
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5436/persona_wallet
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

# VALIDATE, exactly as in production. `create-drop` — the usual tutorial
# choice for tests — would be actively harmful here: the suite would build its
# own schema from the entities and pass, proving NOTHING about whether the
# entities match the migration that ships.
#
# It does real work on Day-07 specifically. Wallet declares precision = 19,
# scale = 4 on the balance; a disagreement with NUMERIC(19,4) fails the boot
# naming the column. A silent mismatch there is money rounded differently than
# the schema promises.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.generator.write-bigdecimal-as-plain=true

# ---------------------------------------------------------------------------
# The JWT secret, here rather than in src/test/resources/application.properties.
#
# That file SHADOWS the main one for every test and is profile-scoped in ways
# that cost four attempts to pin down in the monolith today — properties put
# at the top of it, and properties put in a separate document after `---`,
# both failed to reach the *-it profiles. Putting them in the profile file
# named by the test's own @ActiveProfiles works and is obvious to read.
#
# A DIFFERENT SECRET FROM PRODUCTION, deliberately: a test passing with the
# real signing key would keep passing after that key is rotated.
# ---------------------------------------------------------------------------
persona.jwt.secret=1111111111111111111111111111111111111111111111111111111111111111
